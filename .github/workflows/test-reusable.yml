name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      fail_fast:
        required: false
        type: boolean
        default: false

jobs:
  tests:
    name: Run tests (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Redis server
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run test suite
        run: |
          if [ "${{ inputs.fail_fast }}" = "true" ]; then
            uv run -m pytest -x
          else
            uv run -m pytest
          fi
