name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      fail_fast:
        required: false
        type: boolean
        default: false

jobs:
  tests:
    name: Run tests (Python 3.10)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run test suite
        run: |
          if [ "${{ inputs.fail_fast }}" = "true" ]; then
            uv run -m pytest -x
          else
            uv run -m pytest
          fi
